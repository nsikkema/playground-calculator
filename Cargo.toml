[workspace]
members = [
    "crates/*"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.85.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
blake3 = "1.8.6"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
rustc-hash = "2.1.3"

# Optional dependencies
hotpath = { version = "0.23.2", default-features = false }

datastore = { path = "crates/datastore" }
errors = { path = "crates/errors" }
expression_engine = { path = "crates/expression_engine" }
keys = { path = "crates/keys" }
shareable_string = { path = "crates/shareable_string" }
translation = { path = "crates/translation" }
units = { path = "crates/units" }

[workspace.lints.rust]
deprecated-safe = { level = "warn", priority = -1 }
future-incompatible = { level = "warn", priority = -1 }
keyword-idents = { level = "warn", priority = -1 }
let-underscore = { level = "warn", priority = -1 }
nonstandard-style = { level = "warn", priority = -1 }
refining-impl-trait = { level = "warn", priority = -1 }
rust_2018_compatibility = { level = "warn", priority = -1 }
rust-2018-idioms = { level = "warn", priority = -1 }
rust-2021-compatibility = { level = "warn", priority = -1 }
rust-2024-compatibility = { level = "warn", priority = -1 }
unknown-or-malformed-diagnostic-attributes = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -2 }

missing_debug_implementations = "warn"
missing_docs = "warn"

unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unsafe_code = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

arithmetic_side_effects = "warn"
as_conversions = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
float_arithmetic = "warn"
indexing_slicing = "warn"
missing_const_for_fn = "warn"
missing_docs_in_private_items = "warn"
panic_in_result_fn = "warn"
print_stdout = "warn"
redundant_clone = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
